name: Daily Pakistan Jobs Auto-Updater

on:
  schedule:
    # Runs daily at 06:00 UTC (11:00 AM Pakistan Time)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Pakistan Jobs Fetcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python fetch_jobs.py

      - name: Commit and Push Updated Jobs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update daily Pakistan jobs [skip ci]" && git push)
